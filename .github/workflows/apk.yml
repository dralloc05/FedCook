# Construit l'APK Android de FedCook et le met en ligne.
# Lien direct (à ouvrir sur le téléphone) :
#   https://github.com/dralloc05/FedCook/releases/download/apk/FedCook.apk
# Se lance tout seul quand le dossier android/ change, ou à la main (Run workflow).
# L'APK affiche le site : quand le site change, pas besoin de refaire l'APK.
name: APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Clé de signature
        env:
          CLE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$CLE" ]; then
            echo "$CLE" | base64 -d > "$RUNNER_TEMP/fedcook.jks"
            echo "FEDCOOK_KEYSTORE=$RUNNER_TEMP/fedcook.jks" >> "$GITHUB_ENV"
            echo "Clé de signature FedCook trouvée."
          else
            echo "::warning::Pas de secret ANDROID_KEYSTORE_B64 : APK signé avec une clé de test. Pour mettre à jour l'appli plus tard, il faudra la désinstaller (et perdre ses données)."
          fi

      - name: Construire l'APK
        working-directory: android
        env:
          FEDCOOK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Mettre l'APK en ligne
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk FedCook.apk
          ls -l FedCook.apk
          if ! gh release view apk >/dev/null 2>&1; then
            gh release create apk --title "FedCook pour Android" \
              --notes "Télécharge FedCook.apk sur ton téléphone et ouvre-le pour l'installer."
          fi
          gh release upload apk FedCook.apk --clobber
          echo "APK disponible : https://github.com/${GITHUB_REPOSITORY}/releases/download/apk/FedCook.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FedCook-apk
          path: FedCook.apk
